<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="VIA Assist: offline VIA screening support for community health workers." />
  <title>VIA Assist</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <a class="skip-link" href="#app" data-i18n="skip_to_content">Skip to content</a>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar no-print">
    <div class="topbar-inner">
      <a class="brand" href="#/home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28" focusable="false">
            <rect x="1" y="1" width="30" height="30" rx="9" fill="#0f766e" />
            <circle cx="16" cy="16" r="8.5" fill="#f3a6bd" />
            <path d="M11.5 16.5 L14.8 19.8 L21 12.5" fill="none" stroke="#ffffff" stroke-width="2.6"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span class="brand-name">VIA Assist</span>
      </a>

      <button id="langToggle" class="lang-btn" type="button" data-i18n-aria="lang_switch_aria"
        aria-label="Switch language">हिंदी</button>
    </div>
  </header>

  <!-- ============ SCREEN CONTENT ============ -->
  <main id="app" tabindex="-1"></main>

  <!-- ============ BOTTOM NAVIGATION ============ -->
  <nav class="bottomnav no-print" data-i18n-aria="nav_aria" aria-label="Main navigation">
    <a class="nav-item" href="#/home" data-route="home">
      <span class="nav-icon" aria-hidden="true">🏠</span>
      <span class="nav-label" data-i18n="nav_home">Home</span>
    </a>

    <a class="nav-item" href="#/new" data-route="new">
      <span class="nav-icon" aria-hidden="true">📝</span>
      <span class="nav-label" data-i18n="nav_screen">Screen</span>
    </a>

    <a class="nav-item" href="#/followup" data-route="followup">
      <span class="nav-icon" aria-hidden="true">📋</span>
      <span class="nav-label" data-i18n="nav_followup">Follow-up</span>
      <span class="nav-badge" id="followupBadge" hidden>0</span>
    </a>

    <a class="nav-item" href="#/learn" data-route="learn">
      <span class="nav-icon" aria-hidden="true">📖</span>
      <span class="nav-label" data-i18n="nav_learn">Learn</span>
    </a>
  </nav>

  <div id="toast" class="toast no-print" role="status" aria-live="polite"></div>

  <!-- Scripts loaded in dependency order -->
  <script src="js/i18n.js"></script>
  <script src="js/db.js"></script>
  <script src="js/quality.js"></script>
  <script src="js/via-rules.js"></script>
  <script src="js/illustrations.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
